name: Release APK

# Builds the app and attaches a signed APK to a GitHub release.
#
# Push a tag to publish:
#
#     git tag v1.4 && git push origin v1.4
#
# or run the workflow by hand and give it a tag name.
#
# Signing is required, because Android refuses to install an unsigned APK --
# it reports one as corrupt. Set these four repository secrets once:
#
#     keytool -genkey -v -keystore release.jks -alias happwner \
#         -keyalg RSA -keysize 2048 -validity 10000
#
#     gh secret set KEYSTORE_BASE64 < <(base64 -w0 release.jks)
#     gh secret set KEYSTORE_PASSWORD
#     gh secret set KEY_ALIAS
#     gh secret set KEY_PASSWORD
#
# Keep release.jks safe and never rotate it: Android only upgrades an app in
# place when the new APK carries the same signature.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.4. Created from the current ref if it does not exist.'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Checked before anything is built, so a missing secret costs a few
      # seconds rather than a full build that ends in an APK nobody can install.
      - name: Check that the signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=''
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing KEY_PASSWORD"
          [ -z "$missing" ] && exit 0
          {
            echo '## Signing is not configured'
            echo
            echo "Missing repository secrets:$missing"
            echo
            echo 'Android will not install an unsigned APK -- it reports one as'
            echo 'corrupt -- so nothing was built. Create a keystore and add the'
            echo 'secrets, then re-run:'
            echo
            echo '```console'
            echo 'keytool -genkey -v -keystore release.jks -alias happwner \'
            echo '    -keyalg RSA -keysize 2048 -validity 10000'
            echo
            echo 'gh secret set KEYSTORE_BASE64 < <(base64 -w0 release.jks)'
            echo 'gh secret set KEYSTORE_PASSWORD'
            echo 'gh secret set KEY_ALIAS'
            echo 'gh secret set KEY_PASSWORD'
            echo '```'
            echo
            echo 'Keep `release.jks` -- Android only upgrades an app in place when'
            echo 'the new APK carries the same signature.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Signing secrets are missing:$missing -- see the job summary."
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew is stored without the executable bit, so grant it here rather
      # than depending on the checkout to carry the mode.
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Work out the release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            tag='${{ inputs.tag }}'
          else
            tag='${{ github.ref_name }}'
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A leading "v" is a tag convention, not part of the version.
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The signing config in app/build.gradle.kts reads its keystore out of
      # local.properties, so the secrets are written there instead of being
      # passed on the command line. local.properties is gitignored, and the
      # runner is thrown away afterwards.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo '::error::KEYSTORE_BASE64 did not decode to a keystore. Regenerate it with base64 -w0 release.jks'
            exit 1
          fi
          # A backslash is an escape character in a .properties file, so any in a
          # password has to be doubled or the value silently changes.
          escape() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          # An absolute path, because file() in the android block resolves a
          # relative one against the app module rather than the repository root.
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_PASSWORD=$(escape "$KEYSTORE_PASSWORD")"
            echo "RELEASE_KEY_ALIAS=$(escape "$KEY_ALIAS")"
            echo "RELEASE_KEY_PASSWORD=$(escape "$KEY_PASSWORD")"
          } > local.properties

      - name: Run the unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build the release APK
        run: ./gradlew --no-daemon assembleRelease

      # The build stays green when the signing config does not apply -- it just
      # emits app-release-unsigned.apk -- so the signature is checked here with
      # Android's own tool rather than assumed. This is what stops an APK that
      # a phone would reject as corrupt from reaching a release.
      - name: Verify the APK is signed
        id: apk
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo '::error::assembleRelease produced no APK.'
            exit 1
          fi
          case "$apk" in
            *unsigned*)
              echo "::error::The build produced $apk. The signing config did not apply;" \
                   'check that the secrets match the keystore.'
              exit 1
              ;;
          esac

          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo '::error::apksigner was not found in the Android SDK build-tools.'
            exit 1
          fi
          # minSdk 21 is what the app targets, and it is what decides which
          # signature schemes have to be present.
          "$apksigner" verify --min-sdk-version 21 --print-certs --verbose "$apk" | tee verify.txt

          name="Happwner-${{ steps.release.outputs.version }}.apk"
          mv "$apk" "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### \`$name\`"
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| size | $(du -h "$RUNNER_TEMP/$name" | cut -f1) |"
            echo "| sha256 | \`$(sha256sum "$RUNNER_TEMP/$name" | cut -d' ' -f1)\` |"
            echo "| signer | \`$(grep -m1 'certificate DN' verify.txt | cut -d: -f2- | sed 's/^ //')\` |"
            echo
            echo '<details><summary>apksigner verify</summary>'
            echo
            echo '```'
            cat verify.txt
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # Download this from the Releases page, not from the run's artifacts:
      # GitHub wraps every artifact in a zip, and a zip renamed to .apk is
      # exactly what a phone calls corrupt.
      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # gh is preinstalled on the runner, so no third-party action is needed to
      # publish. An existing release is updated rather than treated as an error,
      # which makes a re-run of a failed publish safe.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "$TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
